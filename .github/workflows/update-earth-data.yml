name: Auto-update Earth phase-coherent data

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  update-earth-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      # These come from GitHub Secrets (you'll add these)
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests numpy earthaccess xarray netCDF4 h5netcdf
      
      - name: Run Earth data update (IERS + GRACE-FO)
        run: |
          python earth_backend.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add earth_data.json earth_data_*.json latest.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🌍 Auto-update Earth data $(date -u +%Y-%m-%d) [IERS+GRACE-FO]"
            git push
          fi
